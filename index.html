const RADIUS_DEFAULT = 150;
const GRACE_LIMIT_DEFAULT = 30;   // minutes — up to this, on time
const GRACE_EXTRA_DEFAULT = 5;    // extra minutes allowed as grace period before "late"
const BREAK_WINDOWS = [

  { slots: ['12:00 AM', '12:30 AM', '1:00 AM'] },

function classifyDuration(mins, cfg) {
  const breakMin = (cfg && cfg.breakMinutes) || GRACE_LIMIT_DEFAULT;
  const graceMin = (cfg && cfg.graceMinutes != null) ? cfg.graceMinutes : GRACE_EXTRA_DEFAULT;
  if (mins <= breakMin) return 'onTime';
  if (mins <= breakMin + graceMin) return 'grace';
  return 'late';
}
function statusColor(status) {
  return status === 'late' ? '#F87171' : status === 'grace' ? '#F5A623' : '#4ADE80';
}
function localDateKey(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
// Groups late-night/early-morning punches (before 6am) with the previous
// calendar day, so a night shift's breaks (e.g. 9pm-3am) all fall under one
// bucket instead of splitting across two calendar dates at midnight.
function shiftDateKey(d = new Date()) {
  const ref = new Date(d);
  if (ref.getHours() < 6) ref.setDate(ref.getDate() - 1);
  return localDateKey(ref);
}
// Sanitizes a group name typed by the person into a valid Firebase key.
function groupKey(str) {
  return str.trim().toLowerCase()
    .replace(/[.#$\[\]\/\s]+/g, '_')
    .replace(/^_+|_+$/g, '')
    .slice(0, 60);
}
// Human-readable label for the current shift bucket, e.g. "Turno del martes 11" —
// makes it clear that a 1am punch still belongs to the shift that started the
// evening before, even though the calendar date has already rolled over.
function shiftLabel() {
  const [y, m, d] = shiftDateKey().split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const dateStr = dt.toLocaleDateString(t('dateLocale'), { weekday: 'long', day: 'numeric', month: 'long' });
  return t('shiftLabelPrefix') + ' ' + dateStr;
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString(t('dateLocale'), { hour: '2-digit', minute: '2-digit' });
}
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = v => v * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error('no geo')); return; }
    const GOOD_ENOUGH = 20;   // meters — stop early once we get a fix this precise
    const MAX_WAIT = 18000;   // ms — give the GPS chip time to lock on indoors
    let best = null;
    let done = false;
    let watchId;
    const finish = (pos, err) => {
      if (done) return;
      done = true;
      if (watchId != null) navigator.geolocation.clearWatch(watchId);
      if (pos) resolve(pos);
      else if (err) reject(err);
    };
    const timer = setTimeout(() => finish(best, best ? null : { code: 3 }), MAX_WAIT);
    watchId = navigator.geolocation.watchPosition(
      pos => {
        if (!best || pos.coords.accuracy < best.coords.accuracy) best = pos;
        if (pos.coords.accuracy <= GOOD_ENOUGH) { clearTimeout(timer); finish(pos); }
      },
      err => { clearTimeout(timer); finish(best, best ? null : err); },
      { enableHighAccuracy: true, maximumAge: 0, timeout: MAX_WAIT }
    );
  });
}
function locErrorText(e) {
  if (e && e.code === 1) return t('locErrDenied');
  if (e && e.code === 3) return t('locErrTimeout');
  return t('locErrGeneric');

/* ---------- Group-scoped Firebase refs ---------- */
function cfgRef() { return db.ref('groups/' + state.myGroup + '/config'); }
function punchesRootRef() { return db.ref('groups/' + state.myGroup + '/punches'); }
function punchesRef(dateKey) { return db.ref('groups/' + state.myGroup + '/punches/' + dateKey); }

let _cfgListenerRef = null;
let _punchesKey = null;
let _punchesListenerRef = null;

function initGroupListeners() {
  if (!state.myGroup) return;
  if (_cfgListenerRef) _cfgListenerRef.off();
  _cfgListenerRef = cfgRef();
  _cfgListenerRef.on('value', snap => {
    state.config = snap.val();
    if (state.config) {
      state.radiusDraft = state.config.radiusMeters;
      state.breakMinDraft = state.config.breakMinutes || GRACE_LIMIT_DEFAULT;
      state.graceMinDraft = state.config.graceMinutes != null ? state.config.graceMinutes : GRACE_EXTRA_DEFAULT;
    }
    render();
  });
  _punchesKey = shiftDateKey();
  if (_punchesListenerRef) _punchesListenerRef.off();
  _punchesListenerRef = punchesRef(_punchesKey);
  _punchesListenerRef.on('value', snap => {
    state.punches = snap.val() || {};
    render();
  });
}
if (state.myGroup) initGroupListeners();

// Re-check every minute in case the app is left open across the shift-date
// boundary (6am), so it starts watching the new bucket automatically.
setInterval(() => {
  if (!state.myGroup) return;
  const key = shiftDateKey();
  if (key !== _punchesKey) {
    _punchesListenerRef.off();
    _punchesKey = key;
    _punchesListenerRef = punchesRef(_punchesKey);
    _punchesListenerRef.on('value', snap => {
      state.punches = snap.val() || {};
      render();
    });
  }
}, 60000);

function myLastPunch() {
  const mine = Object.values(state.punches).filter(p => p.name === state.myName)
    .sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
  return mine[mine.length - 1];
}
// Pairs raw out/in punch events into one row per completed (or open) break,
// so the log shows at most one line per break instead of two.
function pairSessions(punchesObj) {
  const byName = {};
  Object.entries(punchesObj).forEach(([key, p]) => {
    if (!byName[p.name]) byName[p.name] = [];
    byName[p.name].push({ ...p, key });
  });
  const sessions = [];
  Object.values(byName).forEach(list => {
    list.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    let pendingOut = null;
    list.forEach(p => {
      if (p.type === 'out') {
        pendingOut = p;
      } else if (p.type === 'in') {
        sessions.push({ name: p.name, outRec: pendingOut, inRec: p, status: p.status, durationMinutes: p.durationMinutes });
        pendingOut = null;
      }
    });
    if (pendingOut) sessions.push({ name: pendingOut.name, outRec: pendingOut, inRec: null, status: null, open: true });
  });
  sessions.sort((a, b) => new Date((a.inRec || a.outRec).timestamp) - new Date((b.inRec || b.outRec).timestamp));
  return sessions;
}
function deleteSession(session) {
  const updates = {};
  if (session.outRec) updates[session.outRec.key] = null;
  if (session.inRec) updates[session.inRec.key] = null;
  punchesRef(shiftDateKey()).update(updates);
}
// Converts an ISO timestamp to a local "HH:MM" string for pre-filling <input type="time">.
function isoToTimeInput(iso) {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
// Rebuilds a full timestamp from a shift-bucket date + a "HH:MM" time,
// placing times before 6am on the following calendar day (mirrors shiftDateKey).
function buildTimestamp(bucketDate, timeStr) {
  const [y, m, d] = bucketDate.split('-').map(Number);
  const [hh, mm] = timeStr.split(':').map(Number);
  const dt = new Date(y, m - 1, d);
  if (hh < 6) dt.setDate(dt.getDate() + 1);
  dt.setHours(hh, mm, 0, 0);
  return dt.toISOString();
}
async function saveSessionEdit(idx) {
  const sessions = pairSessions(state.punches).slice().reverse();
  const session = sessions[idx];
  if (!session) return;
  const outTimeStr = document.getElementById('editOutTime').value;
  const inTimeStr = document.getElementById('editInTime').value;
  if (!outTimeStr) return;
  const bucketDate = shiftDateKey();
  const outISO = buildTimestamp(bucketDate, outTimeStr);
  const updates = {};
  if (session.outRec) {
    updates[session.outRec.key + '/timestamp'] = outISO;
  }
  if (inTimeStr) {
    const inISO = buildTimestamp(bucketDate, inTimeStr);
    const mins = Math.round((new Date(inISO) - new Date(outISO)) / 60000);
    const status = classifyDuration(mins, state.config);
    if (session.inRec) {
      updates[session.inRec.key + '/timestamp'] = inISO;
      updates[session.inRec.key + '/durationMinutes'] = mins;
      updates[session.inRec.key + '/status'] = status;
    } else {
      const newRef = punchesRef(bucketDate).push();
      updates[newRef.key] = { name: session.name, type: 'in', timestamp: inISO, durationMinutes: mins, status };
    }
  } else if (session.inRec) {
    updates[session.inRec.key] = null;
  }
  await punchesRef(bucketDate).update(updates);
  state.editingIdx = null;
  render();
}
async function saveManualRecord() {
  const name = document.getElementById('manualName').value.trim();
  const outTimeStr = document.getElementById('manualOutTime').value;
  const inTimeStr = document.getElementById('manualInTime').value;
  if (!name || !outTimeStr) return;
  const bucketDate = shiftDateKey();
  const outISO = buildTimestamp(bucketDate, outTimeStr);
  const outRef = punchesRef(bucketDate).push();
  const updates = {};
  updates[outRef.key] = { name, type: 'out', timestamp: outISO };
  if (inTimeStr) {
    const inISO = buildTimestamp(bucketDate, inTimeStr);
    const mins = Math.round((new Date(inISO) - new Date(outISO)) / 60000);
    const status = classifyDuration(mins, state.config);
    const inRef = punchesRef(bucketDate).push();
    updates[inRef.key] = { name, type: 'in', timestamp: inISO, durationMinutes: mins, status };
  }
  await punchesRef(bucketDate).update(updates);
  state.addingManual = false;
  render();
}
async function handlePunch() {
  if (!state.config) return;
  state.geoMsg = null; state.punching = true; render();
  try {
    const pos = await getPosition();
    const dist = haversine(pos.coords.latitude, pos.coords.longitude, state.config.workLat, state.config.workLng);
    const accuracy = Math.round(pos.coords.accuracy || 0);
    // Give the benefit of the doubt for GPS margin of error: if the true
    // position could plausibly be within the radius given the reported
    // accuracy, allow it instead of blocking on an imprecise reading.
    const effectiveDist = Math.max(0, dist - accuracy);
    if (effectiveDist > state.config.radiusMeters) {
      state.geoMsg = { type: 'error', text: t('tooFar')(Math.round(dist), state.config.radiusMeters, accuracy) };
      state.punching = false; render(); return;
    }
    const last = myLastPunch();
    const onBreak = last && last.type === 'out';
    const record = { name: state.myName, type: onBreak ? 'in' : 'out', timestamp: new Date().toISOString() };
    if (onBreak) {
      const mins = Math.round((new Date(record.timestamp) - new Date(last.timestamp)) / 60000);
      record.durationMinutes = mins;
      record.status = classifyDuration(mins, state.config);
    }
    await punchesRef(shiftDateKey()).push(record);
    if (onBreak) {
      const msgKey = record.status === 'late' ? 'lateMsg' : record.status === 'grace' ? 'graceMsg' : 'onTimeMsg';
      state.geoMsg = { type: record.status === 'late' ? 'error' : 'success', text: t(msgKey)(record.durationMinutes) };
    } else {
      state.geoMsg = { type: 'success', text: t('outRecorded') };
    }
  } catch (e) {
    state.geoMsg = { type: 'error', text: locErrorText(e) };
  }
  state.punching = false; render();
}

async function loadLateReport() {

  const late = [];
  Object.keys(all).forEach(dateKey => {

      if (p.status === 'late') late.push({ ...p, date: dateKey, key });

  state.loadingDay = true; render();

  const val = snap.val() || {};
  const list = Object.entries(val).map(([key, p]) => ({ ...p, key }))

}

function copyReport(records, label) {
  if (!records || records.length === 0) return;
  const lines = records.map(p => {
    const date = p.date || state.reportDate;
    const time = fmtTime(p.timestamp);
    const extra = p.status ? ` — ${t('status'+p.status.charAt(0).toUpperCase()+p.status.slice(1))} (${p.durationMinutes} ${t('minutesShort')})` : (p.type === 'out' ? ` — ${t('outLower')}` : '');
    return `${date} · ${p.name} · ${time}${extra}`;
  });
  const text = `${label}\n${lines.join('\n')}`;
  const finish = () => {
    state.copiedMsg = true; render();
    setTimeout(() => { state.copiedMsg = false; render(); }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish).catch(() => {
      prompt('Copia manualmente:', text);
    });
  } else {
    prompt('Copia manualmente:', text);
  }
}

    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <span style="font-size:14px;">${t('greeting')}, <strong>${state.myName}</strong></span>
      <div style="display:flex;gap:14px;">
        <button id="resetNameBtn" class="link-btn">${t('notMe')}</button>
        <button id="resetGroupBtn" class="link-btn">${t('changeGroupLink')}</button>
      </div>
    </div>
    ${scheduleCard}
    ${body}
    <div style="display:flex;align-items:center;gap:6px;margin:24px 0 10px;color:#8B95A1;">
      <span style="font-size:12px;text-transform:uppercase;letter-spacing:0.1em;">${t('todayLog')}</span>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      ${sessions.length === 0
        ? `<p style="font-size:14px;color:#5A6572;padding:16px;">${t('noPunchesYet')}</p>`
        : sessions.map(s => `
          <div class="log-row">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="color:${s.open ? '#F5A623' : (s.status ? statusColor(s.status) : '#4ADE80')}">${s.open ? ICONS.outsmall : ICONS.insmall}</span>
              <span style="font-size:14px;">${s.name}</span>
            </div>
            <div style="display:flex;align-items:center;gap:10px;">
              ${s.open
                ? `<span style="font-size:12px;color:#F5A623;">${t('out')}</span>`
                : `<span style="font-size:11px;color:${statusColor(s.status)};text-transform:uppercase;letter-spacing:0.04em;">${t('status'+s.status.charAt(0).toUpperCase()+s.status.slice(1))} · ${s.durationMinutes}${t('minutesShort')}</span>`}
              <span class="mono" style="font-size:12px;color:#8B95A1;">${fmtTime(s.outRec.timestamp)}${s.inRec ? '–' + fmtTime(s.inRec.timestamp) : ''}</span>
            </div>
          </div>`).join('')}
    </div>
  `;
}
function attachMain() {
  document.getElementById('adminBtn').onclick = openAdmin;
  document.getElementById('resetNameBtn').onclick = resetName;
  document.getElementById('resetGroupBtn').onclick = resetGroup;
  document.getElementById('langBtn').onclick = toggleLang;
  const pb = document.getElementById('punchBtn');
  if (pb) pb.onclick = handlePunch;
}

function adminView() {
  const needsSetup = !state.config;
  let content;

  if (!state.adminUnlocked && !needsSetup) {
    content = `
      <div class="card">
        <div class="eyebrow" style="color:#F5A623;">${ICONS.lock}<span class="display" style="font-weight:700;font-size:15px;text-transform:none;letter-spacing:0;">${t('adminAccess')}</span></div>
        <input id="pinInput" type="password" inputmode="numeric" placeholder="${t('pinPlaceholder')}" style="margin:14px 0 10px;" />
        ${state._pinError ? `<p style="font-size:13px;color:#F87171;margin-bottom:10px;">${state._pinError}</p>` : ''}
        <button class="btn-primary" id="unlockBtn">${t('enterBtn')}</button>
      </div>`;
  } else if (needsSetup && !state.adminUnlocked) {
    const s = state.setup;
    content = `
      <div class="card">
        <div class="eyebrow" style="color:#F5A623;">${ICONS.settings}<span class="display" style="font-weight:700;font-size:15px;text-transform:none;letter-spacing:0;">${t('firstSetup')}</span></div>
        <p style="font-size:14px;color:#8B95A1;margin:8px 0 16px;">${t('firstSetupDesc')}</p>
        <label style="font-size:12px;color:#8B95A1;">${t('pinLabel')}</label>
        <input id="setupPin" type="password" inputmode="numeric" style="margin:6px 0 14px;" value="${s.pin}" />
        <label style="font-size:12px;color:#8B95A1;">${t('radiusLabel')}</label>
        <input id="setupRadius" type="number" style="margin:6px 0 14px;" value="${s.radius}" />
        <button id="captureLocBtn" class="btn-outline" style="${s.coords ? 'background:rgba(74,222,128,0.1);color:#4ADE80;border-color:#4ADE80;' : ''}margin-bottom:8px;">
          ${s.capturing ? `<span class="spin">${ICONS.clock}</span>` : (s.coords ? ICONS.check : ICONS.map)}
          <span>${s.coords ? t('captureLocAgain') : t('captureLoc')}</span>
        </button>
        ${s.locMsg ? `<div class="msg ${s.locMsg.type}"><span>${s.locMsg.type === 'error' ? ICONS.warn : ICONS.check}</span><span>${s.locMsg.text}</span></div>` : ''}
        <p style="font-size:12px;color:#5A6572;margin:10px 0 16px;">${t('captureHint')}</p>
        <button id="finishSetupBtn" class="btn-primary">${t('saveConfigBtn')}</button>
        <p id="setupHint" style="font-size:12px;color:#5A6572;text-align:center;margin-top:8px;"></p>
      </div>`;
  } else {
    const sessions = pairSessions(state.punches).slice().reverse();
    content = `
      <div class="card" style="margin-bottom:16px;">
        <div class="eyebrow" style="color:#4ADE80;">${ICONS.unlock}<span>${t('adminMode')}</span></div>
        <button id="openReportsBtn" class="btn-outline" style="margin-top:14px;">${ICONS.search}<span>${t('reportsBtn')}</span></button>
        <label style="font-size:12px;color:#8B95A1;display:block;margin-top:16px;">${t('radiusLabel')}</label>
        <div style="display:flex;gap:8px;margin:6px 0 4px;">
          <input id="radiusDraft" type="number" inputmode="numeric" value="${state.radiusDraft}" style="flex:1;" />
          <button id="saveRadiusBtn" style="padding:0 18px;border-radius:10px;font-weight:500;background:${state.radiusSaved ? '#4ADE80' : '#F5A623'};color:#12161B;">
            ${state.radiusSaved ? ICONS.check : t('saveBtn')}
          </button>
        </div>
        <p style="font-size:12px;color:#5A6572;margin-bottom:14px;">${t('currentRadius')(state.config.radiusMeters)}</p>
        <button id="relocateBtn" class="btn-outline">
          ${state.capturingLoc ? `<span class="spin">${ICONS.clock}</span>` : ICONS.map}
          <span>${t('relocateBtn')}</span>
        </button>
        ${state.locMsg ? `<div class="msg ${state.locMsg.type}"><span>${state.locMsg.type === 'error' ? ICONS.warn : ICONS.check}</span><span>${state.locMsg.text}</span></div>` : ''}
        <p class="mono" style="font-size:12px;color:#5A6572;margin-top:10px;">${state.config.workLat != null ? state.config.workLat.toFixed(5) : '—'}, ${state.config.workLng != null ? state.config.workLng.toFixed(5) : '—'}</p>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <label style="font-size:12px;color:#8B95A1;">${t('breakDurationLabel')}</label>
        <input id="breakMinDraft" type="number" inputmode="numeric" value="${state.breakMinDraft}" style="margin:6px 0 12px;" />
        <label style="font-size:12px;color:#8B95A1;">${t('graceDurationLabel')}</label>
        <div style="display:flex;gap:8px;margin:6px 0 4px;">
          <input id="graceMinDraft" type="number" inputmode="numeric" value="${state.graceMinDraft}" style="flex:1;" />
          <button id="saveBreakMinBtn" style="padding:0 18px;border-radius:10px;font-weight:500;background:${state.breakMinSaved ? '#4ADE80' : '#F5A623'};color:#12161B;">
            ${state.breakMinSaved ? ICONS.check : t('saveBtn')}
          </button>
        </div>
        <p style="font-size:12px;color:#5A6572;">${t('currentBreakDuration')(state.config.breakMinutes || GRACE_LIMIT_DEFAULT, state.config.graceMinutes != null ? state.config.graceMinutes : GRACE_EXTRA_DEFAULT)}</p>
      </div>
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="padding:14px 16px;font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:#8B95A1;border-bottom:1px solid #2A323C;">${t('editLog')}</div>
        ${sessions.length === 0 ? `<p style="font-size:14px;color:#5A6572;padding:16px;">${t('noRecordsToday')}</p>` :
          sessions.map((s, i) => state.editingIdx === i ? `
          <div class="log-row" style="flex-direction:column;align-items:stretch;gap:10px;">
            <span style="font-size:14px;font-weight:600;">${s.name}</span>
            <div>
              <label style="font-size:11px;color:#8B95A1;">${t('editOutLabel')}</label>
              <input id="editOutTime" type="time" value="${isoToTimeInput(s.outRec.timestamp)}" style="margin-top:4px;" />
            </div>
            <div>
              <label style="font-size:11px;color:#8B95A1;">${t('editInLabel')}</label>
              <input id="editInTime" type="time" value="${s.inRec ? isoToTimeInput(s.inRec.timestamp) : ''}" style="margin-top:4px;" />
            </div>
            <div style="display:flex;gap:8px;">
              <button id="saveEditBtn" class="btn-primary" style="flex:1;padding:10px;">${t('saveEditBtn')}</button>
              <button id="cancelEditBtn" style="flex:1;padding:10px;border-radius:10px;background:#12161B;color:#8B95A1;border:1px solid #2A323C;">${t('cancelBtn')}</button>
            </div>
          </div>` : `
          <div class="log-row">
            <div>
              <span style="font-size:14px;">${s.name}</span>
              <span class="mono" style="font-size:12px;color:#8B95A1;margin-left:8px;">${fmtTime(s.outRec.timestamp)}${s.inRec ? '–' + fmtTime(s.inRec.timestamp) : ' (' + t('out') + ')'}</span>
              ${s.status ? `<span style="font-size:11px;color:${statusColor(s.status)};margin-left:8px;text-transform:uppercase;">${t('status'+s.status.charAt(0).toUpperCase()+s.status.slice(1))} · ${s.durationMinutes}${t('minutesShort')}</span>` : ''}
            </div>
            <div style="display:flex;gap:6px;">
              <button data-idx="${i}" class="edit-session-btn" style="background:rgba(245,166,35,0.1);padding:8px;border-radius:10px;color:#F5A623;">${ICONS.edit}</button>
              <button data-idx="${i}" class="del-session-btn" style="background:rgba(248,113,113,0.1);padding:8px;border-radius:10px;color:#F87171;">${ICONS.trash}</button>
            </div>
          </div>`).join('')}
        <div style="padding:12px 16px;border-top:1px solid #2A323C;">
          ${state.addingManual ? `
            <div style="display:flex;flex-direction:column;gap:10px;">
              <div>
                <label style="font-size:11px;color:#8B95A1;">${t('manualNameLabel')}</label>
                <input id="manualName" placeholder="${t('manualNamePlaceholder')}" style="margin-top:4px;" />
              </div>
              <div>
                <label style="font-size:11px;color:#8B95A1;">${t('editOutLabel')}</label>
                <input id="manualOutTime" type="time" style="margin-top:4px;" />
              </div>
              <div>
                <label style="font-size:11px;color:#8B95A1;">${t('editInLabel')}</label>
                <input id="manualInTime" type="time" style="margin-top:4px;" />
              </div>
              <div style="display:flex;gap:8px;">
                <button id="saveManualBtn" class="btn-primary" style="flex:1;padding:10px;">${t('saveEditBtn')}</button>
                <button id="cancelManualBtn" style="flex:1;padding:10px;border-radius:10px;background:#12161B;color:#8B95A1;border:1px solid #2A323C;">${t('cancelBtn')}</button>
              </div>
            </div>
          ` : `<button id="addManualBtn" class="btn-outline">${ICONS.plus}<span>${t('addManualBtn')}</span></button>`}
        </div>
      </div>`;
  }

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <button id="backBtn" style="background:none;color:#8B95A1;display:flex;align-items:center;gap:6px;font-size:14px;">${ICONS.back}<span>${t('backBtn')}</span></button>
      ${langSwitcherHtml()}
    </div>
    ${content}
  `;
}
function attachAdmin() {
  document.getElementById('backBtn').onclick = closeAdmin;
  document.getElementById('langBtn').onclick = toggleLang;
  const unlockBtn = document.getElementById('unlockBtn');
  if (unlockBtn) {
    unlockBtn.onclick = tryUnlock;
    document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
  }
  const captureBtn = document.getElementById('captureLocBtn');
  if (captureBtn) captureBtn.onclick = captureSetupLocation;
  const finishBtn = document.getElementById('finishSetupBtn');
  if (finishBtn) {
    finishBtn.onclick = finishSetup;
    const pinField = document.getElementById('setupPin');
    const radiusField = document.getElementById('setupRadius');
    const hint = document.getElementById('setupHint');
    function updateSetupState() {
      state.setup.pin = pinField.value;
      state.setup.radius = radiusField.value;
      const pinVal = pinField.value;
      if (!state.setup.coords) hint.textContent = t('missingLoc');
      else if (!pinVal || pinVal.length < 4) hint.textContent = t('pinTooShort');
      else hint.textContent = '';
      finishBtn.disabled = !(pinVal && pinVal.length >= 4 && state.setup.coords);
    }
    pinField.addEventListener('input', updateSetupState);
    radiusField.addEventListener('input', updateSetupState);
    updateSetupState();
  }
  const saveRadiusBtn = document.getElementById('saveRadiusBtn');
  if (saveRadiusBtn) saveRadiusBtn.onclick = saveRadius;
  const saveBreakMinBtn = document.getElementById('saveBreakMinBtn');
  if (saveBreakMinBtn) saveBreakMinBtn.onclick = saveBreakMinutes;
  const relocateBtn = document.getElementById('relocateBtn');
  if (relocateBtn) relocateBtn.onclick = relocate;
  const openReportsBtn = document.getElementById('openReportsBtn');
  if (openReportsBtn) openReportsBtn.onclick = openReports;
  document.querySelectorAll('.del-session-btn').forEach(btn => {
    btn.onclick = () => {
      const sessions = pairSessions(state.punches).slice().reverse();
      const session = sessions[Number(btn.dataset.idx)];
      if (session) deleteSession(session);
    };
  });
  document.querySelectorAll('.edit-session-btn').forEach(btn => {
    btn.onclick = () => { state.editingIdx = Number(btn.dataset.idx); render(); };
  });
  const saveEditBtn = document.getElementById('saveEditBtn');
  if (saveEditBtn) saveEditBtn.onclick = () => saveSessionEdit(state.editingIdx);
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  if (cancelEditBtn) cancelEditBtn.onclick = () => { state.editingIdx = null; render(); };
  const addManualBtn = document.getElementById('addManualBtn');
  if (addManualBtn) addManualBtn.onclick = () => { state.addingManual = true; render(); };
  const cancelManualBtn = document.getElementById('cancelManualBtn');
  if (cancelManualBtn) cancelManualBtn.onclick = () => { state.addingManual = false; render(); };
  const saveManualBtn = document.getElementById('saveManualBtn');
  if (saveManualBtn) saveManualBtn.onclick = saveManualRecord;
}

function reportsView() {
  const tab = state.reportTab;
  let body = '';
  if (tab === 'late') {
    const records = state.lateRecords;
    body = state.loadingLate || records === null
      ? `<p style="font-size:14px;color:#5A6572;padding:16px;">${t('loadingReport')}</p>`
      : `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
          <span style="font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:#8B95A1;">${t('lateReportTitle')(records.length)}</span>
          ${records.length > 0 ? `<button id="copyLateBtn" style="background:#1B2129;border:1px solid #2A323C;color:#F5A623;font-size:12px;padding:6px 10px;border-radius:8px;display:flex;align-items:center;gap:6px;">${ICONS.copy}<span>${t('copyReportBtn')}</span></button>` : ''}
        </div>
        <div class="card" style="padding:0;overflow:hidden;">
          ${records.length === 0
            ? `<p style="font-size:14px;color:#5A6572;padding:16px;">${t('noLateRecords')}</p>`
            : records.map(p => `
              <div class="log-row">
                <div>
                  <span style="font-size:14px;">${p.name}</span>
                  <span class="mono" style="font-size:12px;color:#8B95A1;margin-left:8px;">${p.date}</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <span style="font-size:11px;color:${statusColor('late')};text-transform:uppercase;">${p.durationMinutes} ${t('minutesShort')}</span>
                  <span class="mono" style="font-size:12px;color:#8B95A1;">${fmtTime(p.timestamp)}</span>
                </div>
              </div>`).join('')}
        </div>`;
  } else {
    const records = state.dayRecords;
    const daySessions = records ? pairSessions(Object.fromEntries(records.map(p => [p.key, p]))) : null;
    body = `
      <label style="font-size:12px;color:#8B95A1;">${t('selectDateLabel')}</label>
      <input id="reportDateInput" type="date" value="${state.reportDate}" style="margin:6px 0 16px;" />
      ${state.loadingDay || daySessions === null
        ? `<p style="font-size:14px;color:#5A6572;padding:16px;">${t('loadingReport')}</p>`
        : `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span style="font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:#8B95A1;">${t('dayReportTitle')}</span>
            ${daySessions.length > 0 ? `<button id="copyDayBtn" style="background:#1B2129;border:1px solid #2A323C;color:#F5A623;font-size:12px;padding:6px 10px;border-radius:8px;display:flex;align-items:center;gap:6px;">${ICONS.copy}<span>${t('copyReportBtn')}</span></button>` : ''}
          </div>
          <div class="card" style="padding:0;overflow:hidden;">
            ${daySessions.length === 0
              ? `<p style="font-size:14px;color:#5A6572;padding:16px;">${t('noRecordsForDay')}</p>`
              : daySessions.map(s => `
                <div class="log-row">
                  <div style="display:flex;align-items:center;gap:8px;">
                    <span style="color:${s.open ? '#F5A623' : (s.status ? statusColor(s.status) : '#4ADE80')}">${s.open ? ICONS.outsmall : ICONS.insmall}</span>
                    <span style="font-size:14px;">${s.name}</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:10px;">
                    ${s.status ? `<span style="font-size:11px;color:${statusColor(s.status)};text-transform:uppercase;">${t('status'+s.status.charAt(0).toUpperCase()+s.status.slice(1))} · ${s.durationMinutes}${t('minutesShort')}</span>` : `<span style="font-size:12px;color:#8B95A1;">${t('out')}</span>`}
                    <span class="mono" style="font-size:12px;color:#8B95A1;">${fmtTime(s.outRec.timestamp)}${s.inRec ? '–' + fmtTime(s.inRec.timestamp) : ''}</span>
                  </div>
                </div>`).join('')}
          </div>`}
    `;
  }

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <button id="backBtn" style="background:none;color:#8B95A1;display:flex;align-items:center;gap:6px;font-size:14px;">${ICONS.back}<span>${t('backBtn')}</span></button>
      ${langSwitcherHtml()}
    </div>
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <button id="tabLate" style="flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:600;background:${tab==='late'?'#F5A623':'#1B2129'};color:${tab==='late'?'#12161B':'#8B95A1'};border:1px solid ${tab==='late'?'#F5A623':'#2A323C'};display:flex;align-items:center;justify-content:center;gap:6px;">${ICONS.warn}<span>${t('lateReportTab')}</span></button>
      <button id="tabByDay" style="flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:600;background:${tab==='byDay'?'#F5A623':'#1B2129'};color:${tab==='byDay'?'#12161B':'#8B95A1'};border:1px solid ${tab==='byDay'?'#F5A623':'#2A323C'};display:flex;align-items:center;justify-content:center;gap:6px;">${ICONS.calendar}<span>${t('byDayTab')}</span></button>
    </div>
    ${body}
    ${state.copiedMsg ? `<div class="msg success" style="margin-top:12px;"><span>${ICONS.check}</span><span>${t('copiedMsg')}</span></div>` : ''}
  `;
}
function attachReports() {
  document.getElementById('backBtn').onclick = () => { state.screen = 'admin'; render(); };
  document.getElementById('langBtn').onclick = toggleLang;
  document.getElementById('tabLate').onclick = () => { state.reportTab = 'late'; render(); };
  document.getElementById('tabByDay').onclick = () => { state.reportTab = 'byDay'; render(); };
  const copyLateBtn = document.getElementById('copyLateBtn');
  if (copyLateBtn) copyLateBtn.onclick = () => copyReport(state.lateRecords, t('lateReportTab'));
  const copyDayBtn = document.getElementById('copyDayBtn');
  if (copyDayBtn) copyDayBtn.onclick = () => copyReport(state.dayRecords, `${t('dayReportTitle')} — ${state.reportDate}`);
  const dateInput = document.getElementById('reportDateInput');
  if (dateInput) dateInput.onchange = (e) => changeReportDate(e.target.value);
}

render();
</script>
</body>
</html>
