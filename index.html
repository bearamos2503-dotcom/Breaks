function t(key) { return TRANSLATIONS[state.lang][key]; }

/* ---------- Helpers ---------- */
const RADIUS_DEFAULT = 150;
const GRACE_LIMIT = 30;   // minutes — up to this, on time
const LATE_LIMIT = 35;    // minutes — up to this, grace period; beyond, late
const BREAK_WINDOWS = [
  { slots: ['9:00 PM', '9:30 PM', '10:00 PM'] },
  { slots: ['12:00 AM', '12:30 AM', '1:00 AM'] },
  { slots: ['2:00 AM', '2:30 AM', '3:00 AM'] },
];
function classifyDuration(mins) {
  if (mins <= GRACE_LIMIT) return 'onTime';
  if (mins <= LATE_LIMIT) return 'grace';
  return 'late';
}
function statusColor(status) {
  return status === 'late' ? '#F87171' : status === 'grace' ? '#F5A623' : '#4ADE80';
}
function localDateKey(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString(t('dateLocale'), { hour: '2-digit', minute: '2-digit' });
}
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, toRad = v => v * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) { reject(new Error('no geo')); return; }
    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
  });
}
function locErrorText(e) {
  if (e && e.code === 1) return t('locErrDenied');
  if (e && e.code === 3) return t('locErrTimeout');
  return t('locErrGeneric');
}

const state = {
  lang: localStorage.getItem('lang') || 'es',
  myName: localStorage.getItem('myName') || null,
  config: undefined,   // undefined = loading
  punches: {},          // { pushKey: record }
  screen: 'main',        // main | admin
  adminUnlocked: false,
  geoMsg: null,
  punching: false,
  setup: { pin: '', radius: RADIUS_DEFAULT, coords: null, locMsg: null, capturing: false },
  radiusDraft: RADIUS_DEFAULT,
  radiusSaved: false,
  locMsg: null,
  capturingLoc: false,
  reportTab: 'late',
  lateRecords: null,
  loadingLate: false,
  reportDate: localDateKey(),
  dayRecords: null,
  loadingDay: false,
  copiedMsg: false,
};

db.ref('config').on('value', snap => {
  state.config = snap.val();
  if (state.config) state.radiusDraft = state.config.radiusMeters;
  render();
});
db.ref('punches/' + localDateKey()).on('value', snap => {
  state.punches = snap.val() || {};
  render();
});

/* ---------- Actions ---------- */
function saveName() {
  const val = document.getElementById('nameInput').value.trim();
  if (!val) return;
  localStorage.setItem('myName', val);
  state.myName = val;
  render();
}
function resetName() {
  if (!state.config) {
    // No admin PIN configured yet — allow free reset during initial setup phase.
    localStorage.removeItem('myName');
    state.myName = null;
    render();
    return;
  }
  const pin = prompt(t('resetNamePrompt'));
  if (pin === null) return;
  if (pin === state.config.pin) {
    localStorage.removeItem('myName');
    state.myName = null;
    render();
  } else {
    alert(t('wrongPinAlert'));
  }
}
function myLastPunch() {
  const mine = Object.values(state.punches).filter(p => p.name === state.myName)
    .sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
  return mine[mine.length - 1];
}
async function handlePunch() {
  if (!state.config) return;
  state.geoMsg = null; state.punching = true; render();
  try {
    const pos = await getPosition();
    const dist = haversine(pos.coords.latitude, pos.coords.longitude, state.config.workLat, state.config.workLng);
    if (dist > state.config.radiusMeters) {
      state.geoMsg = { type: 'error', text: t('tooFar')(Math.round(dist), state.config.radiusMeters) };
      state.punching = false; render(); return;
    }
    const last = myLastPunch();
    const onBreak = last && last.type === 'out';
    const record = { name: state.myName, type: onBreak ? 'in' : 'out', timestamp: new Date().toISOString() };
    if (onBreak) {
      const mins = Math.round((new Date(record.timestamp) - new Date(last.timestamp)) / 60000);
      record.durationMinutes = mins;
      record.status = classifyDuration(mins);
    }
    await db.ref('punches/' + localDateKey()).push(record);
    if (onBreak) {
      const msgKey = record.status === 'late' ? 'lateMsg' : record.status === 'grace' ? 'graceMsg' : 'onTimeMsg';
      state.geoMsg = { type: record.status === 'late' ? 'error' : 'success', text: t(msgKey)(record.durationMinutes) };
    } else {
      state.geoMsg = { type: 'success', text: t('outRecorded') };
    }
  } catch (e) {
    state.geoMsg = { type: 'error', text: locErrorText(e) };
  }
  state.punching = false; render();
}

  state.screen = 'admin'; state.adminUnlocked = false;
  state.setup = { pin: '', radius: RADIUS_DEFAULT, coords: null, locMsg: null, capturing: false };
  render();
}
function closeAdmin() { state.screen = 'main'; render(); }
function tryUnlock() {
  const val = document.getElementById('pinInput').value;
  if (state.config && val === state.config.pin) { state.adminUnlocked = true; state._pinError = ''; }
  else { state._pinError = t('wrongPin'); }
  render();
}
async function captureSetupLocation() {
  state.setup.capturing = true; state.setup.locMsg = null; render();
  try {
    const pos = await getPosition();
    state.setup.coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    state.setup.locMsg = { type: 'success', text: t('locCaptured') };
  } catch (e) {
    state.setup.locMsg = { type: 'error', text: locErrorText(e) };
  }
  state.setup.capturing = false; render();
}
async function finishSetup() {
  const pin = document.getElementById('setupPin').value;
  const radius = Number(document.getElementById('setupRadius').value) || RADIUS_DEFAULT;
  if (!pin || pin.length < 4 || !state.setup.coords) return;
  await db.ref('config').set({ pin, workLat: state.setup.coords.lat, workLng: state.setup.coords.lng, radiusMeters: radius });
  state.adminUnlocked = true; render();
}
async function saveRadius() {
  const val = Number(document.getElementById('radiusDraft').value) || RADIUS_DEFAULT;
  await db.ref('config/radiusMeters').set(val);
  state.radiusSaved = true; render();
  setTimeout(() => { state.radiusSaved = false; render(); }, 1800);
}
async function relocate() {
  state.capturingLoc = true; state.locMsg = null; render();
  try {
    const pos = await getPosition();
    await db.ref('config').update({ workLat: pos.coords.latitude, workLng: pos.coords.longitude });
    state.locMsg = { type: 'success', text: t('locUpdated') };
  } catch (e) {
    state.locMsg = { type: 'error', text: locErrorText(e) };
  }
  state.capturingLoc = false; render();
  if (state.locMsg.type === 'success') setTimeout(() => { state.locMsg = null; render(); }, 2500);
}
async function deletePunch(key) {
  await db.ref('punches/' + localDateKey() + '/' + key).remove();
}
function openReports() {
  state.screen = 'reports';
  render();
  loadLateReport();
  loadDayReport(state.reportDate);
}
async function loadLateReport() {
  state.loadingLate = true; render();
  const snap = await db.ref('punches').once('value');
  const all = snap.val() || {};
  const late = [];
  Object.keys(all).forEach(dateKey => {
    Object.entries(all[dateKey]).forEach(([key, p]) => {
      if (p.status === 'late') late.push({ ...p, date: dateKey, key });
    });
  });
  late.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  state.lateRecords = late;
  state.loadingLate = false; render();
}
async function loadDayReport(dateStr) {
  state.loadingDay = true; render();
  const snap = await db.ref('punches/' + dateStr).once('value');
  const val = snap.val() || {};
  const list = Object.entries(val).map(([key, p]) => ({ ...p, key }))
    .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  state.dayRecords = list;
  state.loadingDay = false; render();
}
function changeReportDate(val) {
  state.reportDate = val;
  loadDayReport(val);
}
function copyReport(records, label) {
  if (!records || records.length === 0) return;
  const lines = records.map(p => {
    const date = p.date || state.reportDate;
    const time = fmtTime(p.timestamp);
    const extra = p.status ? ` — ${t('status'+p.status.charAt(0).toUpperCase()+p.status.slice(1))} (${p.durationMinutes} ${t('minutesShort')})` : (p.type === 'out' ? ` — ${t('outLower')}` : '');
    return `${date} · ${p.name} · ${time}${extra}`;
  });
  const text = `${label}\n${lines.join('\n')}`;
  const finish = () => {
    state.copiedMsg = true; render();
    setTimeout(() => { state.copiedMsg = false; render(); }, 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish).catch(() => {
      prompt('Copia manualmente:', text);
    });
  } else {
    prompt('Copia manualmente:', text);
  }
}
function toggleLang() {
  state.lang = state.lang === 'es' ? 'en' : 'es';
  localStorage.setItem('lang', state.lang);

}

  document.documentElement.lang = state.lang;

  if (!state.myName) { app.innerHTML = nameGateView(); attachNameGate(); return; }
  if (state.screen === 'admin') { app.innerHTML = adminView(); attachAdmin(); return; }

  app.innerHTML = mainView(); attachMain();
}

    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <button id="tabLate" style="flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:600;background:${tab==='late'?'#F5A623':'#1B2129'};color:${tab==='late'?'#12161B':'#8B95A1'};border:1px solid ${tab==='late'?'#F5A623':'#2A323C'};display:flex;align-items:center;justify-content:center;gap:6px;">${ICONS.warn}<span>${t('lateReportTab')}</span></button>
      <button id="tabByDay" style="flex:1;padding:10px;border-radius:10px;font-size:13px;font-weight:600;background:${tab==='byDay'?'#F5A623':'#1B2129'};color:${tab==='byDay'?'#12161B':'#8B95A1'};border:1px solid ${tab==='byDay'?'#F5A623':'#2A323C'};display:flex;align-items:center;justify-content:center;gap:6px;">${ICONS.calendar}<span>${t('byDayTab')}</span></button>
    </div>
    ${body}
    ${state.copiedMsg ? `<div class="msg success" style="margin-top:12px;"><span>${ICONS.check}</span><span>${t('copiedMsg')}</span></div>` : ''}
  `;
}
function attachReports() {
  document.getElementById('backBtn').onclick = () => { state.screen = 'admin'; render(); };
  document.getElementById('langBtn').onclick = toggleLang;
  document.getElementById('tabLate').onclick = () => { state.reportTab = 'late'; render(); };
  document.getElementById('tabByDay').onclick = () => { state.reportTab = 'byDay'; render(); };
  const copyLateBtn = document.getElementById('copyLateBtn');
  if (copyLateBtn) copyLateBtn.onclick = () => copyReport(state.lateRecords, t('lateReportTab'));
  const copyDayBtn = document.getElementById('copyDayBtn');
  if (copyDayBtn) copyDayBtn.onclick = () => copyReport(state.dayRecords, `${t('dayReportTitle')} — ${state.reportDate}`);
  const dateInput = document.getElementById('reportDateInput');
  if (dateInput) dateInput.onchange = (e) => changeReportDate(e.target.value);
}

render();
</script>
</body>
</html>
